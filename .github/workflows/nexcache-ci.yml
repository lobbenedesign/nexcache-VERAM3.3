name: NexCache CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config tcl8.6 tclx libssl-dev git libgtest-dev

    - name: Build NexCache (Rubin M3.3 Mode)
      run: |
        # MALLOC=libc: the Makefile defaults to jemalloc on Linux, but jemalloc
        # 5.3.0 has a confirmed crash (je_tcache_bin_flush_small SIGSEGV) under
        # heavy concurrent SET load with this codebase's allocation pattern
        # (root-caused across ASan/TSan/debug-jemalloc runs in a prior session).
        # libc is the deliberately-chosen safe default; don't silently re-enable
        # jemalloc here. It also sidesteps deps/jemalloc/configure being absent
        # on a clean checkout (jemalloc's own vendored .gitignore excludes the
        # autotools-generated configure script, and nothing regenerates it).
        # BUILD_RDMA defaults to yes, but RDMA is a datacenter-networking
        # feature needing librdmacm/libibverbs, which this runner doesn't
        # have installed (and doesn't need for CI). BUILD_RDMA=no is already
        # the documented flag for building on a machine without them.
        make -j$(nproc) RUBIN_MODE=1 MALLOC=libc BUILD_RDMA=no EXTRA_CFLAGS="-D_GNU_SOURCE"
      continue-on-error: false

    - name: Verify Executables
      run: |
        ls -l src/nexcache-server
        ./src/nexcache-server --version

    - name: Run Core Tests (Stabilized)
      timeout-minutes: 25
      run: |
        # Usiamo --clients 1 per evitare race condition sui test TTL/Replication in CI
        # Timeout alzato a 1200 per gestire carichi pesanti in VERA-Mode
        #
        # timeout-minutes above is a hard wall-clock cap on this whole step: --timeout
        # 1200 only bounds tclsh's own per-test accounting, not a runaway retry loop
        # outside any single test (observed once: tests/support/util.tcl's
        # find_available_port kept re-offering an already-occupied port between two
        # test files' servers, spinning "Port N was already busy, trying another
        # port..." for the full 6-hour GitHub Actions job cap before being killed).
        # Root cause not yet isolated; this turns a repeat into a fast, visible
        # failure instead of another silent 6-hour hang.
        ./runtest --verbose --tags -slow --dump-logs --timeout 1200 --clients 1
